# Invoice processing — INVALID workflow (do not "fix")
#
# This workflow is deliberately broken for testing the compiler's
# failure paths. Once FlowSpec v0.1.0 is implemented, compiling this file
# must fail with (at least) the diagnostics listed in README.md.
#
