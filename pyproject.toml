[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flowspec"
dynamic = ["version"]
description = "A type system, static analysis engine, and compiler for AI agent tool workflows."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "FlowSpec contributors" },
]
keywords = [
    "ai-agents",
    "compiler",
    "static-analysis",
    "type-system",
    "workflow",
    "mcp",
    "developer-tools",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Compilers",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = [
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
    "build>=1.2",
]
mcp = [
    "mcp>=1.0",
]
openapi = [
    "jsonschema>=4.20",
    "httpx>=0.27",
]
viz = [
    "networkx>=3.0",
    "graphviz>=0.20",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
]

[project.scripts]
flowspec = "flowspec.cli:main"

[project.urls]
Homepage = "https://github.com/mithun-27/FlowSpec"
Repository = "https://github.com/mithun-27/FlowSpec"
Issues = "https://github.com/mithun-27/FlowSpec/issues"
Changelog = "https://github.com/mithun-27/FlowSpec/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/flowspec/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/flowspec"]

[tool.hatch.build.targets.sdist]
include = [
    "src/flowspec",
    "tests",
    "docs",
    "examples",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
    "SECURITY.md",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]

[tool.ruff.lint.isort]
known-first-party = ["flowspec"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "benchmark: performance benchmarks (long-running, excluded from default CI runs)",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true

[tool.coverage.run]
source = ["flowspec"]

[tool.coverage.report]
show_missing = true
